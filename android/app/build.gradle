plugins {
    id 'com.android.application'
}
android {
    namespace 'fr.pulsepc.app'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.pulsepc.app'
        minSdk 29
        targetSdk 34
        versionCode 20200
        versionName '2.2.0'
    }
    signingConfigs {
        release {
            if (System.getenv('PULSEPC_KEYSTORE')) {
                storeFile file(System.getenv('PULSEPC_KEYSTORE'))
                storePassword System.getenv('PULSEPC_KEYPASS')
                keyAlias 'pulsepc'
                keyPassword System.getenv('PULSEPC_KEYPASS')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('PULSEPC_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.register('copyPulseAssets', Copy) {
    from rootProject.file('..')
    include 'index.html', 'app.css', 'app.js', 'manifest.webmanifest', 'icon-192.png', 'icon-512.png'
    into layout.projectDirectory.dir('src/main/assets')
}
tasks.named('preBuild') { dependsOn 'copyPulseAssets' }
