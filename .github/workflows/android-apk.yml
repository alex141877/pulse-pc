name: Build PulsePC Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Copy web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png android/app/src/main/assets/
      - name: Build APK
        run: gradle --no-daemon -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PulsePC-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
